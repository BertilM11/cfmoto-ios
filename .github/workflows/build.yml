name: Compilar app iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Intel: los equipos macOS arm64 de GitHub a veces no tienen capacidad y el trabajo no
    # arranca. La compilación para iPhone (arm64) no depende del procesador del equipo.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto de Xcode
        run: xcodegen generate

      - name: Compilar (sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project CFMotoLink.xcodeproj \
            -scheme CFMotoLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Empaquetar .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CFMotoLink.app Payload/
          ls Payload/CFMotoLink.app/PlugIns
          test -d Payload/CFMotoLink.app/PlugIns/CFMotoLinkBroadcast.appex
          zip -qry CFMotoLink.ipa Payload
          ls -la CFMotoLink.ipa

      # Paquete con el proyecto de Xcode ya generado, el código, la documentación, las
      # pruebas del panel con su resultado y el .ipa recién compilado.
      - name: Probar el panel y armar el paquete
        run: |
          mkdir -p paquete/CFMotoLink_0.6.1/docs/laminas
          swiftc -O Tools/DashboardCheck/main.swift App/HUD/HUDModel.swift App/HUD/HUDRenderer.swift App/Dashboard/DashModel.swift App/Dashboard/DashRenderer.swift App/Dashboard/MapBase.swift App/Dashboard/DashMapRenderer.swift App/Dashboard/Appearance.swift App/Dashboard/MapCorridor.swift -o dashcheck
          ./dashcheck paquete/CFMotoLink_0.6.1/docs/laminas | tee resultados.txt
          D=paquete/CFMotoLink_0.6.1
          cp -R App Broadcast Shared Tools docs CFMotoLink.xcodeproj project.yml README.md LICENSE .github "$D"/ 2>/dev/null || true
          mv "$D"/docs/laminas/pruebas-panel.txt "$D"/docs/RESULTADOS.txt
          cp CFMotoLink.ipa "$D"/
          (cd paquete && zip -qry ../CFMotoLink_0.6.1_Estabilidad.zip CFMotoLink_0.6.1)
          ls -la CFMotoLink_0.6.1_Estabilidad.zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" CFMotoLink.ipa CFMotoLink_0.6.1_Estabilidad.zip \
            --title "CFMoto Link · compilación ${{ github.run_number }}" \
            --notes "Compilación automática sin firmar. Instálala en el iPhone con Sideloadly o AltStore (se firma con tu Apple ID). Commit: ${{ github.sha }}"

      # Etiquetas de versión: v0.6.0 (respaldo, la compilación 8) y la de esta versión.
      - name: Etiquetas de versión
        run: |
          VERSION=$(grep -m1 'CFBundleShortVersionString' project.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          git fetch -q --tags origin || true
          if ! git rev-parse -q --verify "refs/tags/v0.6.0" >/dev/null; then
            git fetch -q origin 88dfe27796e0e9c56a162544ef6ff718ccfffa43 && git tag v0.6.0 88dfe27796e0e9c56a162544ef6ff718ccfffa43 && git push -q origin v0.6.0 || echo "no se pudo crear v0.6.0"
          fi
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag "v$VERSION" "$GITHUB_SHA" && git push -q origin "v$VERSION" || echo "no se pudo crear v$VERSION"
          fi
          git ls-remote --tags origin | grep -E "refs/tags/v" || true

      # El resumen del registro se publica en la rama ci-logs para poder leer los errores
      # de compilación sin iniciar sesión.
      - name: Publicar registro de compilación
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cilog
          touch build.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/cilog/status.txt
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED|\*\* " build.log | sort -u | head -n 200 > /tmp/cilog/errors.txt || true
          tail -n 200 build.log > /tmp/cilog/tail.txt || true
          cd /tmp/cilog
          git init -q -b ci-logs
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Registro de la compilación ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs
