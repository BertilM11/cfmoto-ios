name: Prueba en simulador

on:
  push:
    branches: [dev/navegacion, dev/dashboard]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sim:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar para simulador
        run: |
          set -o pipefail
          xcodebuild -project CFMotoLink.xcodeproj -scheme CFMotoLink -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath buildsim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" build.log | sort -u | head -n 120 || true
      - name: Dibujar la pantalla de la moto
        if: always()
        run: |
          mkdir -p shots
          swiftc -O Tools/DashboardCheck/main.swift App/HUD/HUDModel.swift App/HUD/HUDRenderer.swift App/Dashboard/DashModel.swift App/Dashboard/DashRenderer.swift -o dashcheck > hud.log 2>&1 && ./dashcheck shots >> hud.log 2>&1 || true
          tail -n 40 hud.log
      - name: Recorrido de demostración
        if: always()
        run: |
          APP=buildsim/Build/Products/Debug-iphonesimulator/CFMotoLink.app
          test -d "$APP" || exit 0
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')]; print(c[0]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location io.github.cfmotolink.app
          xcrun simctl location "$UDID" set 14.6419,-90.5133
          for run in "light 0" "light 2" "night 1" "light 4"; do
            set -- $run
            xcrun simctl terminate "$UDID" io.github.cfmotolink.app || true
            xcrun simctl launch "$UDID" io.github.cfmotolink.app -demo $1 -tab $2
            sleep 28
            xcrun simctl io "$UDID" screenshot "raw-$2.png"
            sips -Z 1100 -s format jpeg -s formatOptions 65 "raw-$2.png" --out "shots/app-tab$2.jpg" > /dev/null
            DATA=$(xcrun simctl get_app_container "$UDID" io.github.cfmotolink.app data)
            cp "$DATA/Documents/demo-log.txt" "shots/log-tab$2.txt" 2>/dev/null || true
            cp "$DATA/Documents/hud.png" "shots/moto-tab$2.png" 2>/dev/null || true
          done
      - name: Publicar resultados
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" build.log | sort -u | head -n 200 > shots/errors.txt || true
          tail -n 60 build.log > shots/tail.txt || true
          cp hud.log shots/ 2>/dev/null || true
          cd shots
          git init -q -b ci-shots
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Capturas de la prueba ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-shots
