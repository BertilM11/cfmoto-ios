name: Prueba en simulador

on:
  push:
    branches: [dev/navegacion, dev/dashboard, dev/mapa, dev/0.6.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sim:
    # Intel: los equipos arm64 de GitHub a veces no arrancan por falta de capacidad.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar para simulador
        run: |
          set -o pipefail
          xcodebuild -project CFMotoLink.xcodeproj -scheme CFMotoLink -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath buildsim \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" build.log | sort -u | head -n 120 || true
      - name: Dibujar la pantalla de la moto
        if: always()
        run: |
          mkdir -p shots
          swiftc -O Tools/DashboardCheck/main.swift App/HUD/HUDModel.swift App/HUD/HUDRenderer.swift App/Dashboard/DashModel.swift App/Dashboard/DashRenderer.swift App/Dashboard/MapBase.swift App/Dashboard/DashMapRenderer.swift App/Dashboard/Appearance.swift App/Dashboard/MapCorridor.swift -o dashcheck > hud.log 2>&1 && ./dashcheck shots >> hud.log 2>&1 || true
          tail -n 40 hud.log
      - name: Recorrido de demostración
        if: always()
        run: |
          APP=buildsim/Build/Products/Debug-iphonesimulator/CFMotoLink.app
          test -d "$APP" || exit 0
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')]; print(c[0]['udid'])")
          echo "$UDID" > udid.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location io.github.cfmotolink.app
          xcrun simctl location "$UDID" set 14.6419,-90.5133
          for run in "light 0" "light 2" "night 1" "light 1" "light 3" "night 4 personalizacion"; do
            set -- $run
            xcrun simctl terminate "$UDID" io.github.cfmotolink.app || true
            xcrun simctl launch "$UDID" io.github.cfmotolink.app -demo $1 -tab $2 -more "${3:-lista}"
            sleep 34
            xcrun simctl io "$UDID" screenshot "raw-$2.png"
            sips -Z 1100 -s format jpeg -s formatOptions 65 "raw-$2.png" --out "shots/app-$1-tab$2.jpg" > /dev/null
            DATA=$(xcrun simctl get_app_container "$UDID" io.github.cfmotolink.app data)
            cp "$DATA/Documents/demo-log.txt" "shots/log-$1-tab$2.txt" 2>/dev/null || true
            cp "$DATA/Documents/hud.png" "shots/moto-$1-tab$2.png" 2>/dev/null || true
            for f in "$DATA"/Documents/hud-*.png; do
              test -f "$f" && cp "$f" "shots/tft-$1-$(basename "$f" .png | sed 's/hud-//').png"
            done
            rm -f "$DATA"/Documents/hud-*.png
          done
      - name: Prueba con la app en segundo plano
        if: always()
        run: |
          APP=buildsim/Build/Products/Debug-iphonesimulator/CFMotoLink.app
          test -d "$APP" && test -f udid.txt || exit 0
          UDID=$(cat udid.txt)
          mkdir -p shots
          xcrun simctl terminate "$UDID" io.github.cfmotolink.app || true
          xcrun simctl launch "$UDID" io.github.cfmotolink.app -demo light -tab 1 -more lista
          # Ruta simulada en marcha y mapa guardándose con la app al frente.
          sleep 45
          DATA=$(xcrun simctl get_app_container "$UDID" io.github.cfmotolink.app data)
          cp "$DATA/Documents/hud.png" shots/bg-1-al-frente.png 2>/dev/null || true
          # Otra app al frente: CFMoto Link pasa a segundo plano (como con el iPhone bloqueado).
          xcrun simctl launch "$UDID" com.apple.Preferences || true
          sleep 50
          cp "$DATA/Documents/hud.png" shots/bg-2-segundo-plano.png 2>/dev/null || true
          # Vuelve al frente.
          xcrun simctl launch "$UDID" io.github.cfmotolink.app || true
          sleep 15
          cp "$DATA/Documents/hud.png" shots/bg-3-de-vuelta.png 2>/dev/null || true
          cp "$DATA/Documents/demo-log.txt" shots/log-segundo-plano.txt 2>/dev/null || true
          grep -E "\[MAPA\]|\[DIAG\]|\[APP\]|\[RUTA\]" shots/log-segundo-plano.txt | tail -n 60 || true

      - name: Publicar resultados
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" build.log | sort -u | head -n 200 > shots/errors.txt || true
          tail -n 60 build.log > shots/tail.txt || true
          cp hud.log shots/ 2>/dev/null || true
          cd shots
          git init -q -b ci-shots
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Capturas de la prueba ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-shots
