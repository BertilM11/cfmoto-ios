name: Pruebas rápidas del panel

# Solo compila y ejecuta las pruebas del dibujo del panel (sin simulador): sirve para revisar
# el diseño en pocos minutos. Las láminas quedan en la rama ci-panel.
on:
  push:
    branches: ['wip/**', '!wip/mapa-**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  panel:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mapa completo de Guatemala (para las pruebas de búsqueda y rutas largas)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WANT=$(cut -d' ' -f1 Tools/OSM/Guatemala.cfmap.sha256)
          gh release download mapa-guatemala -p "Guatemala-${WANT:0:8}.cfmap" -D Tools/DashboardCheck --clobber
          mv "Tools/DashboardCheck/Guatemala-${WANT:0:8}.cfmap" Tools/DashboardCheck/Guatemala.cfmap
          test "$(shasum -a 256 Tools/DashboardCheck/Guatemala.cfmap | cut -d' ' -f1)" = "$WANT"
      - name: Pruebas y láminas del panel
        run: |
          mkdir -p shots
          swiftc -O Tools/DashboardCheck/main.swift App/HUD/HUDModel.swift App/HUD/HUDRenderer.swift App/Dashboard/DashModel.swift App/Dashboard/DashRenderer.swift App/Dashboard/MapBase.swift App/Dashboard/DashMapRenderer.swift App/Dashboard/Appearance.swift App/Dashboard/MapCorridor.swift App/OSM/OSMMapData.swift App/OSM/OSMRenderer.swift App/Dashboard/BrandMark.swift App/Nav/PlaceInput.swift App/Nav/SavedPlaces.swift App/Nav/TrafficPace.swift App/Nav/TripLog.swift App/Nav/RainForecast.swift App/Dashboard/Lyrics.swift Shared/LogBus.swift App/Nav/OnlineSearch.swift App/OSM/OSMRouter.swift App/OSM/OSMSearch.swift App/Nav/GuidedRoute.swift App/Nav/PlannedRoute.swift -o dashcheck > shots/compilacion.txt 2>&1 || true
          grep -E "error:" shots/compilacion.txt | head -n 60 || true
          if [ -x dashcheck ]; then ./dashcheck shots > shots/salida.txt 2>&1 || true; fi
          tail -n 40 shots/salida.txt 2>/dev/null || true
      - name: Publicar resultados
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          cd shots
          git init -q -b ci-panel
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Panel ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-panel
      - name: Veredicto (falla si no compila o si alguna prueba falla)
        run: |
          test -x dashcheck || { echo "No compiló: ver shots/compilacion.txt"; exit 1; }
          grep -q "todas pasan" shots/pruebas-panel.txt || { grep "RESULTADO" shots/pruebas-panel.txt; exit 1; }
