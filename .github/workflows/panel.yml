name: Pruebas rápidas del panel

# Solo compila y ejecuta las pruebas del dibujo del panel (sin simulador): sirve para revisar
# el diseño en pocos minutos. Las láminas quedan en la rama ci-panel.
on:
  push:
    branches: ['wip/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  panel:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas y láminas del panel
        run: |
          mkdir -p shots
          swiftc -O Tools/DashboardCheck/main.swift App/HUD/HUDModel.swift App/HUD/HUDRenderer.swift App/Dashboard/DashModel.swift App/Dashboard/DashRenderer.swift App/Dashboard/MapBase.swift App/Dashboard/DashMapRenderer.swift App/Dashboard/Appearance.swift App/Dashboard/MapCorridor.swift App/OSM/OSMMapData.swift App/OSM/OSMRenderer.swift App/OSM/OSMRouter.swift -o dashcheck > shots/compilacion.txt 2>&1 || true
          grep -E "error:" shots/compilacion.txt | head -n 60 || true
          if [ -x dashcheck ]; then ./dashcheck shots > shots/salida.txt 2>&1 || true; fi
          tail -n 40 shots/salida.txt 2>/dev/null || true
      - name: Publicar resultados
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          cd shots
          git init -q -b ci-panel
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Panel ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-panel
