name: CFMotoLink
options:
  bundleIdPrefix: io.github.cfmotolink
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: es
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 3.0.0
targets:
  CFMotoLink:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: CFMotoLinkBroadcast
      - package: SpotifyiOS
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MotoLink
        CFBundleShortVersionString: "0.7.4"
        CFBundleVersion: "19"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: MotoLink se conecta por Wi-Fi a la pantalla de tu moto para enviarle la imagen.
        NSLocationWhenInUseUsageDescription: MotoLink usa tu ubicación para mostrarte en el mapa, calcular la ruta y guiarte giro a giro.
        NSAppleMusicUsageDescription: MotoLink muestra en la pantalla de la moto la canción que suena en la app Música y te deja pausar o cambiar de canción.
        LSApplicationQueriesSchemes:
          - spotify
          - comgooglemaps
          - waze
        CFBundleURLTypes:
          - CFBundleURLName: io.github.cfmotolink.app
            CFBundleURLSchemes:
              - cfmotolink
        CFBundleLocalizations:
          - es
        UIBackgroundModes:
          - location
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cfmotolink.app
        PRODUCT_NAME: CFMotoLink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
  CFMotoLinkBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: MotoLink
        CFBundleShortVersionString: "0.7.4"
        CFBundleVersion: "19"
        NSLocalNetworkUsageDescription: MotoLink se conecta por Wi-Fi a la pantalla de tu moto para enviarle la imagen.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cfmotolink.app.broadcast
        PRODUCT_NAME: CFMotoLinkBroadcast
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
schemes:
  CFMotoLink:
    build:
      targets:
        CFMotoLink: all
    run:
      config: Release
    archive:
      config: Release
